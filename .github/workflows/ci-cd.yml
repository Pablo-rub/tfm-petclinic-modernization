name: CI/CD Multicloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: eu-west-1
  ECR_REPO_PETCLINIC: petclinic
  ECR_REPO_VETS: vets-service
  ACR_REGISTRY: petclinicacr.azurecr.io
  EKS_CLUSTER: petclinic-eks
  AKS_CLUSTER: petclinic-aks
  AKS_RG: petclinic-rg

jobs:
  # ── 1. Build y test ────────────────────────────────────────────────────────
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build y test monolito
        run: mvn verify -q -Dsurefire.excludes=**/VetControllerTests.java

      - name: Build y test vets-service
        run: mvn verify -q -f vets-service/pom.xml

  # ── 2. Push a Amazon ECR ───────────────────────────────────────────────────
  push-ecr:
    name: Push to ECR
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build y push petclinic
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPO_PETCLINIC:$TAG .
          docker push $REGISTRY/$ECR_REPO_PETCLINIC:$TAG

      - name: Build y push vets-service
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPO_VETS:$TAG ./vets-service
          docker push $REGISTRY/$ECR_REPO_VETS:$TAG

  # ── 3. Push a Azure ACR ────────────────────────────────────────────────────
  push-acr:
    name: Push to ACR
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true  # Tenant UNIR no permite Service Principals; se ejecuta manualmente
    outputs:
      image-tag: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        run: |
          az login --username "${{ secrets.AZURE_CLIENT_ID }}" \
                   --password "${{ secrets.AZURE_PASSWORD }}" \
                   --tenant "${{ secrets.AZURE_TENANT_ID }}"
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Login to ACR
        run: az acr login --name petclinicacr

      - name: Set image tag
        id: meta
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build y push petclinic
        env:
          TAG: ${{ steps.meta.outputs.sha }}
        run: |
          docker build -t $ACR_REGISTRY/$ECR_REPO_PETCLINIC:$TAG .
          docker push $ACR_REGISTRY/$ECR_REPO_PETCLINIC:$TAG

      - name: Build y push vets-service
        env:
          TAG: ${{ steps.meta.outputs.sha }}
        run: |
          docker build -t $ACR_REGISTRY/$ECR_REPO_VETS:$TAG ./vets-service
          docker push $ACR_REGISTRY/$ECR_REPO_VETS:$TAG

  # ── 4. Deploy a Amazon EKS ─────────────────────────────────────────────────
  deploy-eks:
    name: Deploy to EKS
    needs: push-ecr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy vets-service en EKS
        env:
          TAG: ${{ needs.push-ecr.outputs.image-tag }}
        run: |
          helm upgrade --install vets-service ./helm/vets-service \
            -f ./helm/vets-service/values-aws.yaml \
            --set image.tag=$TAG \
            --wait --timeout 5m

      - name: Deploy petclinic en EKS
        env:
          TAG: ${{ needs.push-ecr.outputs.image-tag }}
        run: |
          helm upgrade --install petclinic ./helm/petclinic \
            -f ./helm/petclinic/values-aws.yaml \
            --set image.tag=$TAG \
            --set env.vetsServiceUrl=http://vets-service:8081 \
            --wait --timeout 5m

      - name: Rollback si falla
        if: failure()
        run: |
          helm rollback vets-service 0 --wait || true
          helm rollback petclinic 0 --wait || true

  # ── 5. Deploy a Azure AKS ──────────────────────────────────────────────────
  deploy-aks:
    name: Deploy to AKS
    needs: push-acr
    runs-on: ubuntu-latest
    continue-on-error: true  # Tenant UNIR no permite Service Principals; se ejecuta manualmente
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        run: |
          az login --username "${{ secrets.AZURE_CLIENT_ID }}" \
                   --password "${{ secrets.AZURE_PASSWORD }}" \
                   --tenant "${{ secrets.AZURE_TENANT_ID }}"
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group $AKS_RG --name $AKS_CLUSTER

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy vets-service en AKS
        env:
          TAG: ${{ needs.push-acr.outputs.image-tag }}
        run: |
          helm upgrade --install vets-service ./helm/vets-service \
            -f ./helm/vets-service/values-azure.yaml \
            --set image.tag=$TAG \
            --wait --timeout 5m

      - name: Deploy petclinic en AKS
        env:
          TAG: ${{ needs.push-acr.outputs.image-tag }}
        run: |
          helm upgrade --install petclinic ./helm/petclinic \
            -f ./helm/petclinic/values-azure.yaml \
            --set image.tag=$TAG \
            --set env.vetsServiceUrl=http://vets-service:8081 \
            --wait --timeout 5m

      - name: Rollback si falla
        if: failure()
        run: |
          helm rollback vets-service 0 --wait || true
          helm rollback petclinic 0 --wait || true
