services:
  vets-service:
    build: ./vets-service
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  petclinic:
    build: .
    expose:
      - "8080"
    environment:
      - JAVA_OPTS=-Xmx512m
      - vets.service.url=http://vets-service:8081
    depends_on:
      vets-service:
        condition: service_healthy

  gateway:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - petclinic
      - vets-service
